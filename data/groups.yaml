Description: |-
    Minecraft's official music releases.
    <hr class="split">
    Minecraft was originally made without any sound at all, but in June 2009 C418 released a video of gameplay edited with sound effects, as well as the track calm1.ogg (better known today as "Minecraft") as background music, a track which would become the primary motif in the game's soundtrack. C418 was hired by Notch to write more music for the game and this music was released in Volumes Alpha and Beta. C418 was Minecraft's main composer for almost a decade in addition to Gareth Coker who created most of the soundtracks for the minigames and several mash-up packs in the Legacy Console Editions, and Antimo and Welles, who composed the soundtrack to Story Mode. After releasing 3 singles in 2018 for the Update Aquatic however, C418 left due to disputes with Microsoft and future OSTs were written by other composers such as Lena Raine and Aaron Cherof. From 2020 onwards the vanilla game has recieved a new soundtrack on a yearly basis, themed around the update or drop released at the time, and spin-off games like Minecraft: Dungeons have their own collection of soundtracks. Official music has also been made for DLCs on the Bedrock Edition Marketplace, Minecraft Live shows, crossover events with other games and more.
