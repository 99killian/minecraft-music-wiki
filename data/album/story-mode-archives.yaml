Commentary: |-
 <i>Antimo:</i> (Bandcamp description)
 These songs were recorded over three years, while writing music for the video game series Minecraft: Story Mode.

 These games were a huge part of our lives. They fundamentally changed the way we make music. We wrote a lot of stuff during this period that never got used. Some of it just helped us get ourselves into that world, some was straight up rejected by Telltale (for good reason, maybe), some we loved too much to let go.

 A few of those tracks, I still think about daily. I want people to hear them and don’t think it’s right if they only have a life on my hard drive. With Telltale closed and Minecraft: Story Mode now on Netflix… these songs feel as close to us now as they ever have.

 With much love from us, enjoy this little look into our world.

 x Antimo

