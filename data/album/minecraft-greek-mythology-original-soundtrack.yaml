Commentary: |-
 <i>Gareth Coker:</i> ([Making Mythic Music](https://www.minecraft.net/en-us/article/making-mythic-music))
 The first piece on the Greek Mythology soundtrack - the Song of Seikilos - I actually didn’t write; it’s the oldest surviving musical composition [including musical notation] in the world. I thought it’d be interesting to do my own spin on that. So I got a singer to do the vocals and did a mix of ambient sounds and a couple of Greek-sounding instruments. My goal wasn’t to recreate authentic Greek music, but to give a flavour of it while making it accessible.
 <i>Gareth Coker:</i> ([INTERVIEW: Composer Gareth Coker Talks Minecraft, Ori and More](https://culturedvultures.com/interview-composer-gareth-coker-talks-minecraft-ori-and-more/))
 One interesting note, for the main menu track for Greek Mythology, we did an interpretation of the oldest piece of music ever recorded, Seikilos’ Epitaph. This was actually the first piece of music I wrote for Minecraft, and it was a fun place to start!
