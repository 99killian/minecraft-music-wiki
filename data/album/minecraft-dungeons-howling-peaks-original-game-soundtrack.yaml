Commentary: |-
 <i>Per Landin:</i> ([Dungeons Mixtape Vol.1](https://www.minecraft.net/en-us/article/dungeons-mixtape-vol-1))
 It is said that music is a window to the soul. My soul isn’t much to look at, but my windows are truly stunning! After all, the only soundtrack I’m listening to right now is the Minecraft Dungeons Howling Peaks DLC OST.

 We recently added this album to our growing music collection on Spotify, which now includes seven hours and 40 minutes of musical goodness.
