Commentary: |-
 <i>Per Landin:</i> ([Dungeons Mixtape Vol.1](https://www.minecraft.net/en-us/article/dungeons-mixtape-vol-1))
 The intensity! The energy! The chaos! While the music in Dungeons usually seems to aim for an ambient approach, “Tempest Golem” is more of an epic crescendo that helps bring the latest Dungeons DLC, Howling Peaks, to an anticlimactic end.

 It’s also the perfect theme song for procrastinating writers that desperately fight against impending deadlines by filling their paragraphs with weird metajokes. The drums and the choir really make this a boss battle a fight to remember. If only we had some lyrics to it! Maybe I can commission Minecraft.net’s resident songwriter, Sofia Dankis, to write some for it?
