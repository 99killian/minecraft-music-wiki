Commentary: |-
 <i>Per Landin:</i> ([Dungeons Mixtape Vol.1](https://www.minecraft.net/en-us/article/dungeons-mixtape-vol-1))
 Not only is “Windswept Peaks” the perfect song for traversing high altitudes in the Overworld – it’s also ten minutes long. That’s about as much time as it took me to ~realize I can’t clear a single daily trial~ beat the game on Apocalypse+7!

 While this windy, low-key Howling Peaks theme features both flutes and sitars that really captures the mystery of the mountains, its lack of yodeling and screaming goats is palpable. Everyone knows that the first rule of composing mountain themes requires these two, and without them... well, I’ll just have to yodel with goats myself in the Dungeons in-game level with the same name.
