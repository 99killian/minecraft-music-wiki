Commentary: |-
 <i>Samuel Åberg, Sashen Reddy, Crispin Hands:</i> ([How Does CHAOS Sound? | Minecraft Legends](https://www.youtube.com/watch?v=CPD0CVbDz4U))
 I like to think of Minecraft Legends as controlled cacophony. Part of like what makes it sound good is the chaos. We had a lot of fun with it and I think that's the kind of detail that exists all over the place in our soundscape.

 ...

 The sound design for Minecraft Legends and how it supports the story and the gameplay, specifically for the story, I mean if you think about Minecraft Legends and it being a legend, that gave us a lot of creative freedom to breathe something fresh into something that we thought was familiar. The sound design and music also leads the emotional impact of every scene and every event in the game. Like if there's a big fight we have music that can escalate in different phases,structures that make big blasting sounds, and you feel that you're in the fight.

 ...

 When you enter a new biome in the original Minecraft, all the music is random and the sounds are mostly made of the action you do. Whereas in Minecraft Legends, audio reacts to your actions, so when you venture out on an adventure and you go through different biomes you can hear, oh the weather changes, the music changes. There's a lot of things that is dynamic with the audio and music. Minecraft Legends is a procedurally generated world, every time you play it will be different. So, in designing our music systems, we did imbue a little bit of that randomness. Because the game is, you know, several biomes, and they have their own personality, both in the music and in the ambiences. One of the other things is we have a day/night cycle and it's much more dangerous at night, just like in Minecraft. So, you know, we change the ambiences, we change the music, and in the distance you know we'll have like distant echoes of piglins and like 'oh, things are dangerous in this world now', so it's not safe.
