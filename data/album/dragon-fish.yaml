Commentary: |-
 <i>Patrick McDermott:</i> ([How the ‘Minecraft’ Game Score Unexpectedly Became Big Business For Its Composer](https://archive.is/20260420073349/https://www.billboard.com/pro/how-minecraft-score-became-big-business-for-composer/#selection-2235.0-2235.80))
 There’s a song that the film licensed from us for interpolation across the score. It’s in there a number of times. There’s one song called “Dragonfish” that’s from a separate composition Daniel did during his negotiation with Microsoft, and Microsoft actually owns the rights to that one — well, Daniel owns the royalty and monetization rights, but Microsoft owns the IP. They actually play that song in full in the movie. We have no idea if that was gamesmanship on their part, using one of the songs of Daniel’s that they have better access to, or if they creatively just chose that one.
 <i>C418:</i> (How the ‘Minecraft’ Game Score Unexpectedly Became Big Business For Its Composer)
 To their credit, I find the way they interpolated my song to be quite respectful. I haven’t seen the movie. I don’t know if I want to see the movie. I still need to go to more therapy. [Laughs]