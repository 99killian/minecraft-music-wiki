Track: Cave 14
Duration: 0:11
Artists:
- Samuel Åberg
URLs:
- https://minecraft.wiki/images/Cave14.ogg?5b34f
Commentary: |-
 <i>Samuel Åberg:</i> ([HOW MINECRAFT SOUNDS ARE MADE](https://www.youtube.com/watch?v=4XmJPb4Qt5Y))
 A good example of the community being really interested in what we do is when I made the Cave Sound 14, I inserted a picture of a Creeper in it. You have to use a program like a spectrogram to see this. I mean, you can hear that it sounds a bit funky, but I thought when we released it in Snapshot, it would take a couple of months until someone found it, but it just took a few minutes and then people immediately got that it was a Creeper inside the sound. I think that's pretty amazing.
