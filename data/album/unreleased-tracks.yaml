 When you design ambience for a certain biome or place in a game, you always start with nothing. You have the visuals and then you have to fill it in with sound. And when it comes to the Basalt Deltas I was a bit confused about interpreting the visuals, so when Brandon came up with a keyword "radiation" I suddenly knew what I was looking at, and therefore could interpret it into sound.
---
