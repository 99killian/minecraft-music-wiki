Track: "11"
Duration: 1:11
Color: '#888888'
Artists:
- C418
URLs:
- https://minecraft.wiki/images/11.ogg?348cd
- https://www.youtube.com/watch?v=aLf9lfbI5Kg
Commentary: |-
 <i>C418:</i> (Twitter)
 @notch
 Yes! I now imagine C418 being a weird monster that occasionally records songs from strangers. And then dies in 11
 <i>Kingbdogz:</i> ([Ask Mojang #11: All About Caves & Cliffs](https://www.youtube.com/watch?v=pH_6-ZVOUAk))
 ...I've always been like very interested in... the music discs from Minecraft... disc 11 and disc 13, and even though they're not necessarily related I was definitely very inspired. I mean... back when I was a teenager I was thinking... what's the monster making that noise at the end of... disc 11 or disc 13. And again while they're not necessarily related, I was always just thinking of... what could a scary mob look like in Minecraft?
