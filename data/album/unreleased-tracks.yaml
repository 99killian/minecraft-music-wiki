Track: Great Sky Falling
Duration: 0:04
Artists:
- Unknown
URLs:
- https://minecraft.wiki/w/File:Harmony0.ogg
- https://minecraft.wiki/w/File:Melody0.ogg
- https://minecraft.wiki/w/File:Bass0.ogg
Commentary: |-
 <i>Killian:</i> (wiki editor, 10/13/2026)
 Each Copper horn has 3 different sounds (depending on the angle the horn is played at) that form the complete song when played simultaneously. The different sounds are linked above but the full combination is considered to be the track itself for the purposes of this wiki.
 <i>Minecraft:</i> ([Minecraft Beta & Preview - 1.19.0.24/25 Changelog](https://feedback.minecraft.net/hc/en-us/articles/5540500564365-Minecraft-Beta-Preview-1-19-0-24-25))
 Removed Copper Horn. Although community feedback was mostly positive, the Copper Horn was a fun experiment that didn't quite live up to our design goals, so we decided to remove it. We understand people might be sad, but to be able to try out new and interesting things we need to be able to remove experimental features sometimes. This leaves space for even better features in the future!
 <i>Kingbdogz:</i> (Twitter)
 There aren't future plans outside of it just being diverse instruments. They're more of a social feature than a gameplay feature.

 One thing it can do with the normal goat horn is that you can hear the sound from very far away, so it can be used to locate your friends on a server
