 <i>Killian:</i> (wiki editor)
 This track is now lost media due to the original Vocaroo audio expiring.
 <i>Eric Stirpe:</i> (Tumblr)
 Here’s a treat for you guys. After we had so much fun putting together Jack’s song I started writing a song for Radar called “Taste My Bravery.” I got as far as writing the chorus, but things got nuts and we weren’t able to make the whole song happen.

 This is Radar’s actor, Yuri Lowenthal, doing 4 takes of the stuff I wrote and really giving it his all. Enjoy, everyone.
