Track: Wololo (Evoker prepare)
Duration: 0:02
Artists:
- Chris Rippy
URLs:
- https://minecraft.wiki/w/File:Evoker_prepare_wololo.ogg
Commentary: |-
 <i>Chris Rippy:</i> ([The Life & Times of Video Games: 22 - Wololo](https://lifeandtimes.games/episodes/files/22))
 But then all the voices, that's probably — all the voices in the gamer are pretty much me, and then a completely invented language for that game, for Age of Empires I.
 <i>jeb:</i> ([Meet the Evoker](https://www.minecraft.net/en-us/article/meet-evoker))
 When I added the arms for the spellcasting animation it just looked so funny. We were all joking about how it looked like the priests in Age of Empires, so we started making the priest’s “wololo” noise when we saw them holding up their arms. And since Age of Empires is a Microsoft branded IP and we are also a Microsoft IP now, we were able to get the actual sound effect from Age of Empires too – so it’s exactly the same sound effect!
