 <i>Lena Raine:</i> ([The Sound of Scary](https://www.minecraft.net/en-us/article/the-sound-scary))
 The strongest prompt I had when first approaching the music was that the world of Minecraft, and especially the Nether, is a magical and occult place. I really wanted to take that inspiration and draw from my own interests to give the music a personal flavor, while also holding true to the vibe of the original soundtrack. A particular inspiration was the process of building a portal to the Nether, which very much feels to me like an alchemical process, transmuting one thing to another. I really wanted to imbue my music with that essence of alchemy.

 One of the primary instruments in Minecraft is the piano, and so one of my challenges to myself was to see how far I could push the sound of the piano until it resembled other things entirely – again, that alchemical process. So each piece explores different properties of how to use the piano to create otherworldly sounds. Whether it's the sound of the piano strings being bowed, or plucked, or put through multiple layers of effects, it's all primarily working with one base sound and then layering in other synths and instruments to build up the mood.

 ...

 I wanted each piece to feel like a progression of emotions, or a journey from place to place within this other world. There's a degree of beauty to the Nether, but it is also terrifying in both its details and scale. I love to play with contrast in my music, so one of the pieces really plays with that sense of scale. It goes from this really tight, cramped corridor-like feel, an intimate piano solo, and then grows farther and farther away until it encompasses a huge overwhelming cavern. And so there's equal parts hope, despair, claustrophobia, overwhelming space, beauty and terror, which makes for a delightful variety.

 ...

 I think one of the most intimidating things about coming into any existing game is that there have been years and years of experiences players have had with it, and so suddenly introducing something new can possibly feel like an intrusion into that space. And then take into account that it's Minecraft, one of the biggest games in the world, and suddenly I'm huddled in the corner of my studio going “Oh God, what do I do!?” But the most rewarding thing for me in contrast to that has been taking into account the legacy of the game and its music, and coming up with something new that I hope compliments it well, while also adding my own little flavor to the world.

 ...

 One of the first things I ever noticed about Minecraft when I played an early version years ago was how organically it just rises up out of the world and the ambience. It really feels like a natural extension of the environment. I remember being really drawn in because of that, and was delighted when I started hearing music emerging from nothing. So I really took that to heart when writing new music for the Nether. I wanted every piece to feel like it was rising up as an extension of the existing ambience, that the sounds were being organized into music in a natural way.

 ...

 Writing good ambient music is often a pretty challenging exercise in restraint. There's so many opportunities to stand out that you need to pull yourself back from, because the music needs to sink into the background. I usually write extremely melodic music, but my first drafts for the Nether pieces were actually pretty restrained when it came to melodies. But I was delighted to hear back from the folks at Mojang who wanted to hear even more of my melodies, to make it really sound like "me"! So I gladly went through another pass and added some memorable passages that I hope get stuck in everyone's heads.

 ...

 It's been such a tremendous honor for me to be able to contribute to Minecraft, and I really hope everyone out there that sets foot into the new corners of the Nether enjoys getting a little freaked out to my music. I'm looking forward to hearing your stories and seeing your adventures!
 <i>Lena Raine:</i> ([Lena Raine on Celeste & the Minecraft Nether Update](https://composer.spitfireaudio.com/en/articles/lena-raine-on-celeste-the-minecraft-nether-update))
 It's definitely an immense pressure because Minecraft is a game that has been out there for such a long time, and it also already has a very highly acclaimed score. I honestly had no clue that I would ever even delve into that ecosystem, let alone write new music for the game, so first off it was a big intimidation factor – like, oh no, everyone's gonna judge me! But the concept of adding new music is like the game itself, they're constantly adding things. It's an ever-growing toolbox of things for people to play around with. So the Nether is kind of a creepy alternate dimension – you gather materials and construct a portal that then takes you there. Originally when the game came out it was this hellish, lava cave kind of thing, and one of their latest updates is expanding that with weird creepy trees and mushrooms and stuff. They actually reached out because of my solo album, Oneknowing. They loved the mixture of creepy and calming that some of the tracks had, so they asked me to demo for it. I took a piece that I had written and reworked it in a way that I thought would fit what they were going for, and they really loved it, so they asked me to go ahead and do the rest.

 ...

 Well, I have the benefit of the game already existing, so it was possible for me to actually hop in and play. It’s like a cubist rendition of a spooky environment. I could hear the weird animal sounds that are in the distance, the drips coming from the ceiling – it's very spooky. The audio really sells it, really gives it life. While I was composing they put together these three-minute soundscapes which were like a looping ambience of what each of the areas sounded like. So I put that looping music on in the background while I was writing because I wanted all of the music to just emerge from that soundscape, so you got the sense that the music was emerging from the environment rather than just being wallpaper.
