- https://c418.bandcamp.com/track/minecraft
- https://www.youtube.com/watch?v=vxmOcAde_0s
Commentary: |-
 <i>C418:</i> (Bandcamp description)
 The very first and last song.
 <i>C418:</i> (c418.org)
 “Minecraft” is by far the most minimalist song and also the first song I created for the game. It’s purely pentatonic in scale, builds up very slowly, and then slowly  fades away. This is kind of what I built the entire soundtrack around on.
 <i>C418:</i> ([Q&A: C418’s Minecraft – Volume Alpha Soundtrack](https://web.archive.org/web/20190804183944/https://indiegamesplus.com/2011/05/c418_minecraft_volume_alpha/))
 “Minecraft” is the first song I ever did for Minecraft. It was extremely ambient and experimental, building up very slowly before vanishing. I like the simple notations of it. In my mind it’s the main song, even if it is really calm. It has sold well on iTunes, so that might be one of the favorites. “Minecraft,” “Sweden” and “Clark” were the ones named “Calm 1, 2, 3.”
