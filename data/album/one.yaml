Track: surface pension
Duration: 06:34
URLs:
- https://c418.bandcamp.com/track/surface-pension
- https://www.youtube.com/watch?v=MQOI1u7cjBM
Commentary: |-
 <i>C418:</i> (c418.org)
 “surface pension” is the main theme of the hard and often unnoticed job of working developers. If you pay attention you can hear them clicking away on their keyboards. This song also uses the same progression as “preliminary art form”, and as an antagonised version in “post success depression”. All of these songs are essentially the same, but they all carry completely different messages across. While “surface pension” is about the hard work, “preliminary art form” is about the trance you have when working on a thing for so long that it becomes second nature. Finally “post success depression” identifies with the times when working hard becomes the enemy.
