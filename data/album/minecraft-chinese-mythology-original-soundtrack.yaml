Commentary: |-
 <i>Minecraft:</i> (Mash-up Pack Marketplace description)
 Journey through epic terrain and find enlightenment in this mythical Mash-up!
 <i>Gareth Coker:</i> ([INTERVIEW: Composer Gareth Coker Talks Minecraft, Ori and More](https://culturedvultures.com/interview-composer-gareth-coker-talks-minecraft-ori-and-more/))
 The Minecraft Mythology expansions were done in a fairly quick period of time (5-6 weeks from concept to final recording). Having lived in Japan, China was never far away for a quick trip, and I’ve always been fascinated by Asian music, so a lot of the research was already done. 4J Studios (who make the expansions) did not want a super-authentic traditional Chinese soundtrack, but rather, taking elements of Chinese music and mixing them with a traditional Western orchestral soundtrack. To make this feel like a blend of both worlds, I focused on using solo instruments from the region, such as erhu, dizi, hulusi and xiao, and then limited myself (mostly) to the more traditional Chinese harmony and scales.
 <i>Gareth Coker:</i> ([The sounds of… Gareth Coker](https://mcvuk.com/development-news/the-sounds-of-gareth-coker/))
 My work on the mythology series for Minecraft (Greek, Chinese, Norse and Egyptian mythologies) has been very defined for obvious reasons. We are working in a set environment based on ancient history and a specific established sound is required or expected. That said, even with that series, I’m still able to do my own spin on things. Even if the scales and harmony I’m using are correct to the part of the world I’m evoking, the production quality and aesthetic is usually my own.
 <i>Gareth Coker:</i> ([Making Mythic Music](https://www.minecraft.net/en-us/article/making-mythic-music))
 In June 2015, I got a message from an audio director at Microsoft, asking whether I’d like to write music for Minecraft. And of course I thought about that for half a second and said yes.

 ...

 The tracks for the Mythologies have to reflect the potential scope of the visuals you might be encountering in the game. It’s more like creating an album. With Chinese Mythology, we basically wanted an hour’s worth of Chinese-themed cinematic music - and what that means is a bunch of nice tracks that ebb and flow and are good to listen to independently of the game. They need to sound like complete pieces of music. All of these tracks can loop, but if they sound like a loop, you’re not doing your job.

 ...

 Usually I get soloists in pretty early. They’re doing a lot of the melodic stuff so they help sell the piece. But when it gets to the large numbers of players - the strings section on Greek had 25 players, and Chinese Mythology had an even larger group - that all has to be approved in synthesiser form first.

 ...

 The first two weeks are spent writing, composing and planning things out - maybe recording a couple of soloists. Everything you hear is take two or take three. The players have never seen the music before - there’s no time to rehearse. Take one is usually good. Take two is usually very good. Take three is usually the one we use - if we have time for a third take. That’s standard for the film industry. They’re such talented musicians, and you’re on the clock in the recording studio - every second is valuable. Luckily, the players are brilliant at sight-reading.

 ...

 Then we record, then we mix, then we deliver! And all of that takes place over a month-long period. It’s very intense! But I’ve proven I can do it now, so I guess it’s going to be the status quo going forward! It’s also a fun process, though. I wouldn’t be doing it if I wasn’t having fun.
