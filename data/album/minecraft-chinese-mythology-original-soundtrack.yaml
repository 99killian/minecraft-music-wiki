Commentary: |-
 <i>Gareth Coker:</i> ([Making Mythic Music](https://www.minecraft.net/en-us/article/making-mythic-music))
 But my favourite track on the album is Zhu Baije. It’s very upbeat, but it’s still a combat piece. The Chinese violin player, Karen Han - who’s played on Kung Fu panda, and lots of other Chinese-themed movies in Hollywood - does an amazing job on this track. Particularly the last minute: what she’s playing is incredibly difficult and she pulls it off with ease.
