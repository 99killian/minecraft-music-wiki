Commentary: |-
 <i>Gareth Coker:</i> ([Making Mythic Music](https://www.minecraft.net/en-us/article/making-mythic-music))
 On Chinese Mythology, I really like the first track on the album, Xuanzang. It’s this big epic, thematic thing, but it also ebbs into folk music in the middle. There’s this very reedy sounding instrument called the hulusi - it makes you feel like you’re on a Chinese farm.
