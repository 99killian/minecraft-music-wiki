Commentary: |-
 <i>Per Landin:</i> ([Dungeons Mixtape Vol.1](https://www.minecraft.net/en-us/article/dungeons-mixtape-vol-1))
 Grab a pair of your sharpest shears – we’re heading for the dense jungle! Most of us Minecraft players are used to playing with blocks, but a majority has likely never used a woodblock – an instrument that together with the piano and flute really adds a feeling of mystery and exploration to the score.

 The choice of flute really baffles me though – I was positive that fellow composers Peter Hont, Johan Johnson, and Samuel Åberg were going to feature me on this track after I gave them a personal demonstration of my skills on the recorder. It was so good that they cut me off after merely three seconds: “We’ve heard enough”.
