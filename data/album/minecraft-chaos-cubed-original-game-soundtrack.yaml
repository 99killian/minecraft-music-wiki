Commentary: |-
 <i>fingerspit:</i> ([The cool tunes of Chaos Cubed](https://www.minecraft.net/en-us/article/chaos-cubed-composer-interview))
 I never thought the temporary names would be the final ones, but now looking back, I find it really funny. Lots of people are confused about why some tracks play in different biomes that don’t make sense with the name, but I just didn’t know! I still think they are names that fit the tracks, though!

 ...

 I’m really happy with the reception of the music overall! I know that with such a massive player base, it would be an impossible task to make everyone happy, but still, it’s been really nice to see so many people connecting with it, and with everything that I had in mind while I was making it.

 I’m proud of my work on it, of feeling that I got to make something that felt like Minecraft, that has my own style imprinted in it, and that so many players around the world get to listen to and enjoy. I'm really grateful that I had the chance to make music for a game that meant so much to me over 15 years ago.

 ...

 I just got an email about it from Mojang. They asked if I would be interested in making the music for the new update, and I couldn’t believe it, but I guess that did happen!
