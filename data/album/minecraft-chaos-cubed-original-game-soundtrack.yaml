Commentary: |-
 <i>fingerspit:</i> ([The cool tunes of Chaos Cubed](https://www.minecraft.net/en-us/article/chaos-cubed-composer-interview))
 I was given complete creative freedom for the [music] disc. I just made a track that felt fun to make and to listen to, something to bang your head around in a really chill way, and really going all the way in with adding my own style to the game. I wanted it to feel kind of unique and to add something else to the rest of the discs.