 What happened.
 The video has reached 2.9M views and nearly 29,000 likes. Viewers called it “the best mob theme song ever”, compared it to the parody songs of Minecraft’s early years, and, as with the Minecraft Live 2022 anthem, many asked for it to be a music disc in the game.