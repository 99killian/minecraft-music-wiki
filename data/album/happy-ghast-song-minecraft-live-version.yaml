Commentary: |-
 <i>Minecraft:</i> (Twitter)
 Interrupting your #MinecraftLIVE for a quick jam sesh.
 ⚠️ Side effects may include humming for hours.
 <i>Minecraft:</i> (Music video description)
 A happy ghast theme song!? You better believe it! Learn the lyrics and sing along in this moving melody from Minecraft LIVE!
 <i>Paul Everatt:</i> ([Happy Ghast Song, Minecraft Live | Paul David Everatt](https://www.pauldavideveratt.com/case-studies/happy-ghast/))
 Happy Ghast.
 A theme song for a mob, arranged and mixed a week before the deadline.

 What I did.
 This was a collaboration with vocalist Aria Sivick, original song composer Jonti Picking (aka Mr. Weebl) and composer Will Dodson, with backing vocals from Jonti Picking, Katt Wade, Dan Lloyd, James William Hughes and myself.
 Two composers and multiple singers had produced two versions of this song, both of which I mixed. Neither was quite what the client was looking for to represent Minecraft Live 2025. The first version was too “quirky” and the second composer’s version was too “Disney”.
 With the deadline looming, I arranged and remixed a version that took elements from both, keeping some of the edge of the first while making it more palatable for a general audience, then mixed and mastered it. It saved the agency from having to find another composer for a new version, and it hit that sweet spot the client adored.
 This was white label work through Element Animation.

 Work in progress.
 A few of the versions along the way, from the original composition to the demos we worked through. There was a key change too.

