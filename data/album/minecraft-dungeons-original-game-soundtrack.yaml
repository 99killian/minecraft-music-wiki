Commentary: |-
 <i>Adriane Kuzminski:</i> (["Spoopy and serene – making the sound of ‘Minecraft Dungeons’ with Mojang’s audio team:"](https://www.asoundeffect.com/minecraft-dungeons-game-audio/))
 Hello all, and thank you for speaking with us. First off, it’s interesting how Minecraft Dungeons is epic and action-oriented yet the serene soundscapes and music are balanced in a way that no energy is lost during the combat scenes. How did the team ensure that Dungeons would be aesthetically compatible with the past Minecraft games while bringing the franchise in a new direction?
 <i>Peter Hont:</i>
 I think our guiding light was always the visuals. Had we gone down the traditionally dark ARPG visual style, the audio would have followed suit. As it turned out, we ended up creating a more accessible and light-hearted game. I believe that is what made it clear for us how to treat the legacy of Vanilla Minecraft in a more hectic setting. In one word, spoopy.
 <i>Rostislav Trifonov:</i>
 Our goal was to capture both the relaxing atmosphere of Vanilla Minecraft and blend it with more cinematic/fantasy type of hack and slash combat elements. The result was that the player can experience both being able to relax and enjoy the surrounding world, and at the next moment engage in an intense action-driven battle. While the music and ambiance is serene, we accentuated the battles with layers of hard-hitting cinematic and fantasy effects. Moreover, we wanted to develop further the Minecraft feel by blending in a bit of an arcade feel on top of the fantasy and magical elements. The result I believe is a pretty unique combination of genres that proves the Minecraft universe could potentially keep expanding in many different directions :)
 <i>Samuel Åberg:</i>
 Dungeons is action oriented, so to second what is stated above: we were sort of forced to follow suit. With joy we did! Who doesn’t want to design a Harp Crossbow? A mini boss encounter of an Enderman that makes the whole screen dark and static? All these elements not only brought a lot of new things to our world, but also did so with a lot more detail than in Vanilla.

 One of the challenges was of course then: authenticity. For a feeling of a true authentic Minecraft game I think it’s very important to anchor the experience with a “feel at home” element for our players. The Camp is the player base in Minecraft Dungeons. This also happens to be the most Vanilla Overworld-looking and feeling place in the game. This became the perfect spot for that authenticity anchor. My philosophy is that if we succeed in creating this soundscape in a way that feels at home and authentic to our players; we can take out the turns quite vividly out on the levels of battlefield without losing the authenticity of the brand. Personally I think the music alone in the Camp is one of the best things we created in the whole game.

 We decided early on, which I think resonates with Vanilla Minecraft as well, that things are allowed to sound scary and heavy hitting. This is a universe that is filled with both light and dark magic.

 ...

 <i>Adriane Kuzminski:</i>
 As you entered the dungeon crawler sphere, did you find inspiration from the sound of other games in this genre, like Diablo III, Torchlight, or even The Legend of Zelda?
 <i>Peter Hont:</i>
 I believe the entire team brought their own perception of what all of those classic games mean in terms of aesthetics. However, I would say that the explicit nods to our ancestors in the genre were kept to a minimum, seeing as we wanted to stay true to what Vanilla Minecraft is and should be about for the foreseeable future. To me that is a sense of limitless adventure and mystery, conveyed through vague ideas and broad concepts. Specifically I believe that the music was helped a lot by this, as it currently sits in between being simple and readable, while giving listeners clues about their environment without standing in the way of the goal of the adventure.
 <i>Rostislav Trifonov:</i>
 As a big fan of the mentioned games, I was definitely influenced by the ‘feel’ of their soundscape. I have personally grown up with Diablo and I believe it has definitely inspired me to develop my own style of fantasy and magic sound design, which I would say I specialize in. It’s definitely an amazing experience to be able to take the fantasy genre to the next level by combining it with the iconic Minecraft style.
 <i>Samuel Åberg:</i>
 In the beginning of the development I played a lot of Diablo and Torchlight, so I’m sure I have drawn inspiration from that. The audio elements of the arcade visuals, such as Emeralds and Beams were something completely new to the Minecraft universe. The inspiration I drew for some of those definitely could stem from Zelda and Final Fantasy.

 It’s a balance act. It’s great if one shot sounds are recognizable and “popping”. But at the same time: they need to somewhat fit and not become intrusive. This has been one of the most challenging parts for me designing sound for Dungeons. I was first very unsure if I liked the emerald sound design. I usually feel sounds like these have a high risk of becoming slimy and being “video game sounds” they are too easy to like. I remember when the team tested out the emeralds for the first time and all really instantly loved the pick up noises. I still have conflicting feelings about it. Good design is appreciated. Great design will meet some resistance before its greatness is recognized.

 ...

 <i>Adriane Kuzminski:</i>
 Since many of you have musical backgrounds (which is apparent from the game’s many musical sounds), what was the collaboration like for these sound effects, and were the musical tracks a collaborative effort with Johan Johnson, too?
 <i>Peter Hont:</i>
 I think that grew organically from all of us being at least somewhat musically active at some point in time and wanting to use that as an additional layer when communicating with the players. I think we used the sound effects in a very literal way, conveying materials, weight and other concrete, physical parameters. The musical elements are, with exception for some of the bows, conveying a more abstract idea or feeling. For example there is a bow where the arrangement is a pastiche of baroque music to fit the exalted nature of the bow’s origin that the name and description implies.

 I believe Johan was the sole composer for the first 2 years of development. My contribution was born out of necessity as we needed more music than Johan had time to produce. So without ever talking directly to him, I tried to mix what he had done thus far with elements that I thought would fit the genre, the game, and the story as a whole. I think people have appreciated the mixed styles quite a lot.
 <i>Rostislav Trifonov:</i>
 I actually began my audio journey with electronic/ambient music. Eventually my career transitioned into sound design, which was a natural progression since I liked to create spatial musical soundscapes. I always try to approach sound effects from a musical/tonal standpoint at the start of the design process. I try to blend in the pitch of all the different elements together and also make sure the final effect works with the music or ambiance tonally. Also, sometimes I like to play sound effects through synths for additional morphing (using the synth’s effects, etc.).

 ...

 <i>Adriane Kuzminski:</i>
 Any final thoughts you’d like to share?
 <i>Samuel Åberg:</i>
 Look for the eye.

 <i>Samuel Aberg:</i> ([The Sound of Scary](https://www.minecraft.net/en-us/article/the-sound-scary))
 Music and sound design play a huge role in the expansion of the Minecraft universe. Every new Minecraft experience needs its own strong audio identity. All new audio should be unique, yet still feel connected and united with Vanilla Minecraft. This is something I feel really passionate about.

 ...

 Be it the new Nether biomes, a creepy crypt in Minecraft Dungeons, or a beautiful AR landscape in Minecraft Earth, these places in our games not only look like Minecraft, but they all really feel like Minecraft. I think music and sound play a huge role here. Visually, people have a strong impression of what Minecraft looks like. But I also firmly believe that Minecraft has a unique expression when it comes to sound design and music.
