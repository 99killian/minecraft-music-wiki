Commentary:  |-
 <i>Kumi Tanioka:</i>
 Another track, “pokopoko”, includes a new sound that we created using a bamboo instrument. It’s a simple but warm tone, and it allowed me to approach the world of Minecraft from a different perspective.

 ...

 Of course, I like all three songs because I put my heart and soul into them, but I especially like “pokopoko”. In this track I wanted to express a bird's-eye view of the world of Minecraft while delving a little more freely into it. To craft “pokopoko”, I travelled throughout the Overworld, listening to all the great Minecraft music as I explored, and then I imagined the world I wanted to express.
