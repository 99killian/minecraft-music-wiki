Duration: 5:03
Artists:
- Lena Raine
URLs:
- https://www.youtube.com/watch?v=6B7PqW2NKeQ
Commentary: |-
 <i>Lena Raine:</i>
 Keeping the trial chambers in mind framed my entire composition process. Especially “Deeper”, which felt like a piece closely tied to my visualization of the trial chambers: new colors, materials, and a sense of intentional design in an otherwise chaotic space.
 I was determined to try out some new sounds for “Deeper”, but nothing I did seemed to work. I spent two days recording, but I didn't like where it was going. So I made the radical decision to scrap everything and start again (which was really tough after 2 days of work!) What I ended up with, however, ended up becoming one of my favorite tracks.

 “Deeper” isn’t as dark as some of the Nether tracks, but it speaks to a slightly darker side of the Overworld, and evokes a feeling of constrained darkness.

 ...

 ’Deeper’ really sticks out for me. Perhaps because it's a bit of a weird one in terms of how I came up with it, because I had to throw away two days’ work and start from scratch! On my second attempt, I started with a glitched-out piano synth which can be heard after the intro, before it goes into the main groove. The way it cuts up the rhythm into different rhythmic groupings was really inspiring to start playing with polyrhythms and build up the mood. I also played with the processing on the synths to create this wonderful sense of tension.
