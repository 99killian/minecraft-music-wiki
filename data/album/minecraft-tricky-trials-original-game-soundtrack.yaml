- https://www.youtube.com/watch?v=TRY0tH78Tjk
Commentary: |-
 <i>Lena Raine:</i>
 There are a lot of composers playing with microtonal compositions, or breaking from western tonality. As a composer who primarily works within conventional harmony, I've always wanted to try writing less "normal"-sounding music, and I played a lot with a sense of tuning in the second half of 'Endless'. I wanted to toy with the perception of tonality (which instrument feels out of tune with which?) and was pleasantly surprised by the result!
