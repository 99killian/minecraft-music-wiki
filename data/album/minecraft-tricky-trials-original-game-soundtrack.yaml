Commentary: |-
 <i>Aaron Cherof:</i>
 I’ve been composing for a long time, but having a musical idea come to me in a dream is something that’s only happened twice in my entire life! “Watcher” had been rattling around unfinished in my head for a while, so it spent a lot more time “in the oven” than my typical songs. Working on this update was the inspiration I’d needed to give “Watcher” form, and finish it! It’s pretty magical to hear it out in the world after being trapped in my head for so long!
