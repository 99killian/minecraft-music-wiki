Commentary: |-
 <i>Kumi Tanioka:</i> ([Composing the Trial Chambers](https://www.minecraft.net/en-us/article/composing-trial-chambers))
 I never want to destroy the world that Minecraft fans have in their minds, and I also want to express my own feelings in the music, too. Finding the balance between how far to go and where to restrain myself while also making Minecraft fans happy was difficult!

 ...

 For the first time, I used an instrument called aquarion [a glass xylophone]. I love the sound of the piano, so I really wanted to use its tone, but I had been struggling to express something new with only the piano. Then I heard the aquarion, and the instrument really resonated with me. I immediately thought of a motif for a Minecraft song!

 ...

 These songs are for listeners who love the Minecraft universe, who love Minecraft music, and while of course you can listen to my songs separately as a soundtrack, I hope that you will take some time to listen to my music while playing. I wrote my songs in the hope that players who are on a journey inside Minecraft will not wake up from that dream world. On the contrary, I hope the music will help them immerse themselves in their Minecraft world even further, and enjoy it even more.

 ...

 I never thought I would be part of building the Minecraft world again, so I feel very honored to have been able to create these three songs.

 <i>Aaron Cherof:</i> ([Composing the Trial Chambers](https://www.minecraft.net/en-us/article/composing-trial-chambers))
 It’s Minecraft’s 15-year anniversary this year, and I wanted to celebrate that by using mostly minimalistic instrumentation. Piano has always been at the heart of Minecraft music, and many of the songs I wrote for Tricky Trials have piano at their core – along with a few extra surprises along the way for listeners. I hope players can enjoy a feeling of nostalgia even when listening to songs they’ve never heard before as they embark on an adventure through the unknown!
