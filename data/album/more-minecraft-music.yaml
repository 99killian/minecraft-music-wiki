 <i>Calle Wachtmeister:</i> ([Minecraft: Nether Trailer](https://ambiens.studio/portfolio-item/minecraft-nether/))
 Are you ready to get to know the darker side of Minecraft?

 So excited about the work with this Minecraft trailer! Music wise I did a remake of the classic ”In the Hall of the Mountain King” by Edvard Grieg. The music is constantly increasing tempo which was challenging but also really fun.

 The movie has 12 milj views on youtube and almost 50.000 comments at the moment.

 Thank you Mojang and Svep!
