 <i>Minecraft:</i> (Youtube description)
 Relax to this re-imagined music from Minecraft Legends! Pet some animals, fortify a village, or just explore the Overworld to these laidback lutes, remixed from Minecraft Legends' original soundtrack. Whether you're looking to wind down or focus intensely, these tracks provide a soothing backdrop for work, study, relaxing, and gaming. Especially helpful if you're focusing on hunting down some piglins!
