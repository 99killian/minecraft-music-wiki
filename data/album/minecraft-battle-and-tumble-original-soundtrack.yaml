 ...That’s more closely tied to the gameplay, especially the Tumble mini game which is just tremendously, ridiculously fast-paced. All of the tracks there are a minute long because most of the rounds are over in less than a minute. You have to write a lot of music - just in terms of the number of notes - just to make it sound really busy and exciting.
