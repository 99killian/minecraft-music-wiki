Commentary: |-
 <i>Antimo & Welles:</i> (Youtube comment)
 dude you're really commenting sensible questions on every track. we did call it that for a minute. when you're writing music with software, you've got to save your project pretty much as soon as you hit upon any good idea. which means you've got to name the project before you've finished really writing the song. we've come up with all sorts of crazy project names over the years (no i'm not going to tell you any!). usually they're stupid, though sometimes they represent a kind of vibe you're aiming for. so just know that johnny denim came from that sorta spirit. i think there was a version of this track that was way over the top 80s sounding, when we were trying to hone in on what worked best, that we named the rise of johnny denim. i'm not sure that the final version had this name. though i really have no idea how we came up with that name. while i was mixing this i had an image in the corner of my monitor of john travolta in very tight jeans, maybe that's where it came from? the only other thing i can say is that deadlines were tight and we weren't sleeping much... and we laughed a lot to deal with the stress -a
---
Track: Stone By Stone [101] 
Duration: 02:38
URLs:
- https://antimo.bandcamp.com/track/stone-by-stone-101
Commentary: |-
 <i>Antimo & Welles:</i> (Youtube comment)
 this was our first attempt at writing a song for the training montage in episode one. i'm pretty sure we hadn't yet seen the scene when we wrote this and quickly ditched it once we did. as such, it's sat unfinished on my hard drive for six years - and i've mostly kept it in that state for you today. just a slight cleanup and mastering for loudness. the rawness of some of these early ones is cooler to me than if i went back and messed with it too much. more tomorrow.
 <i>Antimo & Welles:</i> (Youtube comment)
 @spectral_damian we almost put it on that album. the deal with archives is it's stuff that was definitively rejected or that we wrote but didn't turn in. a version of this was delivered and made it into the game files so that disqualified it.
