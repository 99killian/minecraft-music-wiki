Commentary: |-
 <i>Antimo:</i> (Bandcamp description)
 This is an act of preservation, to help prevent this game being lost to history. It is no longer for sale by its creator - hasn't been for a good while.

 I am tired of paying to host this material on soundcloud. It's better here, where you can listen for free, ad free.


 Find here every song used in the game, that we have made a “full song” version of. These are the versions that have previously been posted on our YouTube channel (www.youtube.com/antimowelles), organized here in the order that they appear in the games (to the extent it’s possible to do so), starting with Season 1 Episode 1 and ending with Season 2 Episode 5.

 Please share this album as the definitive collection. Please do not upload this material yourself to streaming platforms like YouTube or Spotify. If you’d like to see this material on Spotify, the best thing you can do is request Microsoft and Mojang properly release this on those platforms and/or make these games purchasable again.

 Thank you for caring about this after all this time.


 xAntimo
