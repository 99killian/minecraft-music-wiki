 <i>Just Dance:</i> (announcement)
 Minecraft x Just Dance - an epic 15th anniversary!

 Are you ready for the most epic crossover ever?

 On December 11, join us in dancing to a song that celebrates 15 incredible years of both Just Dance and Minecraft! Dive into "Pigstep (Just Dance x Minecraft version)", a brand-new Minecraft-themed song by Lena Raine, Minecraft, Dancing Bros.

 Join Steve on his journey to explore the Nether and Overworld, and dance throguh blocky dimensions. Encounter all your favorite charcters from the beloved game, including sheep, creepers, skeletons, and even Alex... Whether you are a Just Dance lover or a Minecraft fan, this new song is full of exciting surprises!

 Don't forget to activate your Just Dance+ free trial, so that you too can join the party!
 <i>Just Dance:</i> (description)
 Dance 'N Craft!

 Adventure is calling! Follow Steve until the very end of the Nether and Overworld!