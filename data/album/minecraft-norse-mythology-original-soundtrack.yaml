Commentary: |-
 <i>Minecraft:</i> (Mash-up Pack Marketplace description)
 Are you heroic enough to enter the Great Hall, Valhalla? Find out in the Norse Mythology Mash-up! Compose your own grand saga as you voyage through the 9 realms, from the treetops of Yggdrasil, down into the mines of Svartalfheim and the depths of Hel!
 <i>Minecraft:</i> (Mash-up Playstation Store description)
 Are you heroic enough to enter the Great Hall, Valhalla? Find out in the Norse Mythology Mash-up! Compose your own grand saga as you voyage through the 9 realms, from the treetops of Yggdrasil, down into the mines of Svartalfheim and the depths of Hel! The third episode in the mythology series, this pack has hand carved textures, a thunderous soundtrack and a horde of skins. Skål!
 <i>Gareth Coker:</i> ([Making Mythic Music](https://www.minecraft.net/en-us/article/making-mythic-music))
 The tracks for the Mythologies have to reflect the potential scope of the visuals you might be encountering in the game. It’s more like creating an album. They need to sound like complete pieces of music. All of these tracks can loop, but if they sound like a loop, you’re not doing your job.

 ...

 With the Mythologies it’s more like a grand picture - not really accentuating what the player is doing - but about enveloping them in the world.

 ...

 Usually I get soloists in pretty early. They’re doing a lot of the melodic stuff so they help sell the piece. But when it gets to the large numbers of players - the strings section on Greek had 25 players, and Chinese Mythology had an even larger group - that all has to be approved in synthesiser form first.

 ...

 The first two weeks are spent writing, composing and planning things out - maybe recording a couple of soloists. Everything you hear is take two or take three. The players have never seen the music before - there’s no time to rehearse. Take one is usually good. Take two is usually very good. Take three is usually the one we use - if we have time for a third take. That’s standard for the film industry. They’re such talented musicians, and you’re on the clock in the recording studio - every second is valuable. Luckily, the players are brilliant at sight-reading.

 ...

 Then we record, then we mix, then we deliver! And all of that takes place over a month-long period. It’s very intense! But I’ve proven I can do it now, so I guess it’s going to be the status quo going forward! It’s also a fun process, though. I wouldn’t be doing it if I wasn’t having fun.
